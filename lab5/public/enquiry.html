<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry | Doraemon Gadgets</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef9ff;
            color: #123;
        }

        /* NAVBAR */

        nav {
            height: 75px;

            background: #0795df;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            color: white;

            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .logo span {
            color: #ffd900;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #ffe000;
        }

        /* PAGE HEADER */

        .page-header {
            text-align: center;

            padding: 70px 20px 40px;

            background:
                linear-gradient(
                    135deg,
                    #d9f5ff,
                    white
                );
        }

        .page-header h1 {
            color: #087ecb;
            font-size: 48px;

            margin-bottom: 12px;
        }

        .page-header p {
            color: #666;
            font-size: 18px;
        }

        /* FORM */

        .form-container {
            width: 90%;
            max-width: 800px;

            margin: 40px auto 70px;

            background: white;

            padding: 40px;

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.12);

            border: 1px solid #d6effc;
        }

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            color: #087ecb;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 13px;

            border: 2px solid #d4edf8;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: #fafdff;
        }

        input:focus,
        select:focus,
        textarea:focus {

            border-color: #0795df;

            box-shadow:
                0 0 8px
                rgba(7,149,223,0.2);
        }

        textarea {

            height: 130px;

            resize: vertical;
        }

        .submit-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background: #087ecb;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {
            background: #005e9e;
        }

        /* CONTACT BOX */

        .contact-box {

            width: 90%;
            max-width: 800px;

            margin: -35px auto 60px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        .contact-card {

            background: white;

            padding: 22px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 6px 20px
                rgba(0,0,0,0.08);
        }

        .contact-card .icon {

            font-size: 35px;

            margin-bottom: 8px;
        }

        .contact-card h3 {

            color: #087ecb;

            margin-bottom: 6px;
        }

        .contact-card p {

            color: #666;

            font-size: 14px;
        }

        /* FOOTER */

        footer {

            background: #057fc1;

            color: white;

            text-align: center;

            padding: 25px;
        }

        /* RESPONSIVE */

        @media(max-width: 700px) {

            nav {

                flex-direction: column;

                height: auto;

                padding: 20px;

                gap: 15px;
            }

            nav ul {
                gap: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .contact-box {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: 25px;
            }

            .page-header h1 {
                font-size: 38px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🔵 Doraemon <span>Gadgets</span>
        </div>

        <ul>

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="/about">About Us</a>
            </li>

            <li>
                <a href="/enquiry">Enquiry</a>
            </li>

        </ul>

    </nav>


    <!-- HEADER -->

    <section class="page-header">

        <h1>Gadget Enquiry 📩</h1>

        <p>
            Have a question about one of our futuristic gadgets?
            Send us an enquiry!
        </p>

    </section>


    <!-- FORM -->

    <div class="form-container">

        <form>


            <div class="form-row">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="form-group">

                    <label for="gadget">
                        Select Gadget
                    </label>

                    <select id="gadget">

                        <option value="">
                            Choose a gadget
                        </option>

                        <option>
                            Anywhere Door
                        </option>

                        <option>
                            Time Machine
                        </option>

                        <option>
                            4D Pocket
                        </option>

                        <option>
                            Take-Copter
                        </option>

                        <option>
                            Memory Bread
                        </option>

                        <option>
                            Small Light
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Enter enquiry subject"
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Your Message
                </label>

                <textarea
                    id="message"
                    placeholder="Write your enquiry here..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Send Enquiry 🚀
            </button>


        </form>

    </div>


    <!-- CONTACT INFORMATION -->

    <div class="contact-box">


        <div class="contact-card">

            <div class="icon">📧</div>

            <h3>Email</h3>

            <p>
                gadgets@example.com
            </p>

        </div>


        <div class="contact-card">

            <div class="icon">📞</div>

            <h3>Phone</h3>

            <p>
                +91 98765 43210
            </p>

        </div>


        <div class="contact-card">

            <div class="icon">📍</div>

            <h3>Location</h3>

            <p>
                Tokyo, Japan
            </p>

        </div>


    </div>


    <!-- FOOTER -->

    <footer>

        <p>
            💙 Doraemon Gadget World |
            Explore Beyond Imagination 🚀
        </p>

    </footer>


</body>

</html>
